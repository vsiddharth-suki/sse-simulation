services:
  sse:
    build: ./server
    environment:
      PORT: "3000"
      LOG_PATH: /app/runs/server.jsonl
    volumes:
      - ./runs:/app/runs
      - ./server/config.json:/app/config.json:ro

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    environment:
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-60s}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - sse
